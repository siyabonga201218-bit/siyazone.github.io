<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIYAZONE | GAMEZONE</title>
<style>
:root{--r:#ff2638;--bg:#080808}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}header{padding:24px 5%;background:#111;border-bottom:3px solid var(--r)}h1{margin:0;font-size:clamp(30px,6vw,52px)}h1 span{color:var(--r)}header p,.muted{color:#bbb}.wrap{max-width:1100px;margin:auto;padding:22px 4%}.hero,.panel,.card{background:#151515;border:1px solid #4b2025;border-radius:14px;padding:18px}.hero{background:linear-gradient(120deg,#390b12,#111)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{padding:12px;background:#222;color:white;border:1px solid #555;border-radius:8px;flex:1;min-width:160px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border-color:#333}.card:hover{border-color:var(--r);transform:translateY(-2px)}.emoji{font-size:30px}button{background:var(--r);color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer;margin:3px}button.secondary{background:#333;border:1px solid #555}#play{display:none;margin-top:22px}.msg{color:#ff8c96;min-height:24px}canvas{display:block;max-width:100%;background:#050505;border:1px solid #555;border-radius:8px;margin:12px auto;touch-action:manipulation}.board{display:grid;gap:4px;max-width:420px;margin:12px auto}.board button{margin:0;min-width:0}footer{text-align:center;color:#999;padding:30px;border-top:1px solid #333;margin-top:30px}
</style></head><body>
<header><h1>SIYA<span>ZONE</span> 🎮</h1><p>GAMEZONE • PLAY MORE. GAME TOGETHER.</p></header>
<main class="wrap"><section class="hero"><h2>WELCOME TO SIYAZONE</h2><p>20 browser games. Play directly on this website.</p><b>Created by Siyabonga Sibanda</b></section>
<div class="tools"><input id="search" placeholder="Search games..."><select id="cat"><option>All</option><option>Arcade</option><option>Puzzle</option><option>Sports</option><option>Strategy</option><option>Adventure</option></select><button class="secondary" onclick="sound=!sound;this.textContent=sound?'🔊 Sound on':'🔇 Sound off'">🔊 Sound on</button></div>
<div class="grid" id="games"></div><section id="play" class="panel"><button class="secondary" onclick="closeGame()">✕ Close</button><h2 id="title"></h2><div id="content"></div></section></main>
<footer>© 2026 SIYAZONE • Created by Siyabonga Sibanda<br>TikTok: @itzurboiisiya1 • YouTube: @itzurboiisiya⁂</footer>
<script>
const data=[['Pong','Arcade','🏓'],['Brick Breaker','Arcade','🧱'],['Sky Flyer','Adventure','🛩️'],['Maze Runner','Puzzle','🌀'],['Sudoku','Puzzle','🔢'],['Word Search','Puzzle','🔎'],['Hangman','Puzzle','🔤'],['Word Scramble','Puzzle','🔠'],['Simon Says','Arcade','🎨'],['Whack-a-Mole','Arcade','🐹'],['Connect Four','Strategy','🔴'],['Checkers','Strategy','♟️'],['Chess','Strategy','♜'],['Dots and Boxes','Strategy','🔲'],['Minesweeper','Puzzle','💣'],['Basketball','Sports','🏀'],['Bowling','Sports','🎳'],['Penalty Shootout','Sports','⚽'],['Mini Golf','Sports','⛳'],['Trivia Challenge','Puzzle','❓']];
let sound=true,timer=null;const $=id=>document.getElementById(id),root=$('games'),play=$('play'),out=$('content');
function beep(){if(!sound)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=550;g.gain.value=.04;o.start();o.stop(c.currentTime+.07)}catch(e){}}
function cards(){root.innerHTML='';data.forEach((g,i)=>{if(($('cat').value==='All'||$('cat').value===g[1])&&g[0].toLowerCase().includes($('search').value.toLowerCase())){let d=document.createElement('article');d.className='card';d.innerHTML=`<div class="emoji">${g[2]}</div><small>${g[1]}</small><h3>${g[0]}</h3><button>PLAY</button>`;d.querySelector('button').onclick=()=>start(i);root.append(d)}})}
$('search').oninput=cards;$('cat').onchange=cards;cards();
function closeGame(){clearInterval(timer);timer=null;play.style.display='none';out.innerHTML=''}
function start(i){closeGame();play.style.display='block';$('title').textContent=data[i][0];play.scrollIntoView({behavior:'smooth'});({0:pong,1:brick,2:fly,3:maze,4:sudoku,5:wordsearch,6:hangman,7:scramble,8:simon,9:mole,10:connect,11:checkers,12:chess,13:dots,14:mines,15:basketball,16:bowling,17:penalty,18:golf,19:trivia}[i])()}
function add(tag,text){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;out.append(e);return e}
function btn(text,fn,parent=out){let b=document.createElement('button');b.textContent=text;b.onclick=()=>{beep();fn()};parent.append(b);return b}
function status(){let e=add('p','');e.className='msg';return e}
function canvas(w=500,h=280){let c=add('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function pong(){add('p','Use W/S or arrow keys. First to 5 points.');let[c,x]=canvas(),py=110,cy=110,bx=250,by=140,vx=4,vy=3,a=0,b=0,run=true,s=add('p','You 0 — 0 CPU');function key(e){if(e.key==='ArrowUp'||e.key==='w')py=Math.max(0,py-22);if(e.key==='ArrowDown'||e.key==='s')py=Math.min(220,py+22)}window.addEventListener('keydown',key);function tick(){if(!run)return;x.clearRect(0,0,500,280);x.fillStyle='white';x.fillRect(10,py,9,60);x.fillRect(481,cy,9,60);x.beginPath();x.arc(bx,by,7,0,7);x.fill();bx+=vx;by+=vy;cy+=(by-30-cy)*.04;if(by<7||by>273)vy*=-1;if(bx<25&&by>py&&by<py+60)vx=Math.abs(vx);if(bx>475&&by>cy&&by<cy+60)vx=-Math.abs(vx);if(bx<0||bx>500){if(bx<0)b++;else a++;s.textContent=`You ${a} — ${b} CPU`;bx=250;by=140;vx=4*(bx<250?1:-1);if(a===5||b===5){run=false;s.textContent+=' — '+(a===5?'You win!':'CPU wins!')}}if(run)requestAnimationFrame(tick)}activeCleanup=()=>{run=false;window.removeEventListener('keydown',key)};tick()}
let activeCleanup=()=>{};
function brick(){let[c,x]=canvas(),px=205,bx=250,by=220,vx=3,vy=-3,score=0,blocks=[];for(let r=0;r<4;r++)for(let k=0;k<8;k++)blocks.push({x:10+k*61,y:15+r*23,on:true});let s=add('p','Move pointer/finger to move paddle.');c.onpointermove=e=>px=(e.clientX-c.getBoundingClientRect().left)*500/c.clientWidth-40;function tick(){x.clearRect(0,0,500,280);blocks.forEach(b=>{if(b.on){x.fillStyle='#ff2638';x.fillRect(b.x,b.y,52,14)}});x.fillStyle='white';x.fillRect(px,260,85,9);x.beginPath();x.arc(bx,by,7,0,7);x.fill();bx+=vx;by+=vy;if(bx<7||bx>493)vx*=-1;if(by<7)vy*=-1;if(by>250&&bx>px&&bx<px+85)vy=-Math.abs(vy);blocks.forEach(b=>{if(b.on&&bx>b.x&&bx<b.x+52&&by>b.y&&by<b.y+14){b.on=false;vy*=-1;score++;s.textContent='Bricks: '+score}});if(by>280||blocks.every(b=>!b.on)){s.textContent+=by>280?' — Game over':' — You cleared the bricks!';return}requestAnimationFrame(tick)}tick()}
function fly(){let[c,x]=canvas(),y=130,obs=[],score=0,run=true,s=add('p','Tap canvas or FLY to rise. Avoid red blocks.');function jump(){y-=35}c.onclick=jump;btn('FLY',jump);function tick(){if(!run)return;x.clearRect(0,0,500,280);x.fillStyle='#ffcb55';x.beginPath();x.arc(70,y,12,0,7);x.fill();if(Math.random()<.025)obs.push({x:510,h:30+Math.random()*150});x.fillStyle='#f23';obs.forEach(o=>{o.x-=3;x.fillRect(o.x,0,25,o.h);x.fillRect(o.x,o.h+85,25,195-o.h)});obs=obs.filter(o=>o.x>-30);y+=2;score+=.03;s.textContent='Score '+Math.floor(score);if(y<0||y>280||obs.some(o=>o.x<82&&o.x>45&&(y<o.h||y>o.h+85))){run=false;s.textContent+=' — Crash!';return}requestAnimationFrame(tick)}activeCleanup=()=>run=false;tick()}
function maze(){let m=['########','#S...#E#','#.#....#','#.#.##.#','#......#','########'],r=1,c=1,box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(8,1fr)';let s=status();function paint(){box.innerHTML='';m.forEach((row,ri)=>[...row].forEach((v,ci)=>{let b=btn(ri===r&&ci===c?'🙂':v==='#'?'⬛':v==='E'?'🏁':'·',()=>move(ri,ci),box);b.disabled=v==='#'}))}function move(nr,nc){if(m[nr]?.[nc]&&m[nr][nc]!=='#'){r=nr;c=nc;paint();if(m[r][c]==='E')s.textContent='You escaped!'}}function key(e){let dr=0,dc=0;if(e.key==='ArrowUp')dr=-1;if(e.key==='ArrowDown')dr=1;if(e.key==='ArrowLeft')dc=-1;if(e.key==='ArrowRight')dc=1;move(r+dr,c+dc)}window.addEventListener('keydown',key);activeCleanup=()=>window.removeEventListener('keydown',key);add('p','Use arrow keys or tap an adjacent square.');paint()}
function sudoku(){let ans='534678912672195348198342567859761423426853791713924856961537284287419635345286179',vals='530070000600195000098000060800060003400803001700020006060000280000419005000080079'.split(''),box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(9,1fr)';vals.forEach((v,i)=>{let inp=document.createElement('input');inp.value=v==='0'?'':v;inp.maxLength=1;inp.disabled=v!=='0';inp.style.width='100%';inp.style.background='#222';inp.style.color='white';inp.style.padding='8px 0';inp.style.textAlign='center';box.append(inp)});let s=status();btn('Check solution',()=>s.textContent=[...box.children].every((e,i)=>e.value===ans[i])?'Solved!':'Keep trying.')}
function wordsearch(){let words=['GAME','PLAY','BALL','CODE'],letters='GAMEPLAYBALLCODE'.padEnd(64,'X').split(''),box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(8,1fr)';letters.forEach(ch=>btn(ch, e=>{},box));add('p','Find: GAME • PLAY • BALL • CODE. Words are placed across the first rows.')}
function hangman(){let w=['ROCKET','GAMING','BASKET','PUZZLE'][Math.floor(Math.random()*4)],used=[],wrong=0,s=add('p',''),letters=add('div');function paint(){s.textContent=[...w].map(c=>used.includes(c)?c:'_').join(' ')+' | Misses: '+wrong+'/6'}'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>btn(ch,()=>{if(used.includes(ch)||wrong>=6)return;used.push(ch);if(!w.includes(ch))wrong++;paint();if([...w].every(c=>used.includes(c)))s.textContent+=' — You win!';if(wrong===6)s.textContent+=' — Word: '+w},letters));paint()}
function scramble(){let w=['BASKETBALL','COMPUTER','GAMING','RACING','PUZZLE'][Math.floor(Math.random()*5)],mix=w.split('').sort(()=>Math.random()-.5).join('');add('h3','Unscramble: '+mix);let inp=add('input');inp.placeholder='Your answer';let s=status();btn('Check',()=>s.textContent=inp.value.toUpperCase()===w?'Correct!':'Try again.')}
function simon(){let seq=[],level=0,turn=0,s=add('p','Start a sequence.');let box=add('div');['red','blue','green','gold'].forEach(col=>{let b=btn(col.toUpperCase(),()=>{if(seq[turn]!==col){s.textContent='Wrong! Level '+level;seq=[];turn=0;return}turn++;if(turn===seq.length){level++;turn=0;s.textContent='Correct! Level '+level;setTimeout(next,500)}},box);b.style.background=col});function next(){seq.push(['red','blue','green','gold'][Math.random()*4|0]);s.textContent='Remember: '+seq.join(' → ')}btn('Start',()=>{seq=[];level=0;next()})}
function mole(){let score=0,left=20,box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(3,1fr)';let s=add('p','Score 0 | Time 20'),cells=[];for(let i=0;i<9;i++)cells.push(btn('🕳️',()=>{if(cells[i].textContent==='🐹'){score++;cells[i].textContent='🕳️';s.textContent='Score '+score+' | Time '+left}},box));timer=setInterval(()=>{left--;cells.forEach(b=>b.textContent='🕳️');cells[Math.random()*9|0].textContent='🐹';s.textContent='Score '+score+' | Time '+left;if(left<=0)clearInterval(timer)},1000)}
function connect(){let b=Array(42).fill(0),t=1,box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(7,1fr)';let s=status();function paint(){box.innerHTML='';b.forEach((v,i)=>{let q=btn(v?'●':'·',()=>{let c=i%7;for(let r=5;r>=0;r--)if(!b[r*7+c]){b[r*7+c]=t;break}t=3-t;paint();s.textContent='Turn: '+(t===1?'Red':'Yellow')},box);q.style.background=v===1?'#e22':v===2?'#c99b00':'#222'})}paint();add('p','Two players on one device. Tap a column.')}
function checkers(){let s=add('p','Two-player practice: tap a piece then a diagonal empty square.'),b=Array(64).fill('');for(let i=0;i<24;i++)if((i/8|0+i%8)%2)b[i]='⚫';for(let i=40;i<64;i++)if(((i/8|0)+i%8)%2)b[i]='🔴';let sel=-1,t='🔴',box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(8,1fr)';function paint(){box.innerHTML='';b.forEach((v,i)=>{let q=btn(v||'·',()=>{if(sel<0&&v===t)sel=i;else if(sel>=0&&!v&&Math.abs((i/8|0)-(sel/8|0))===1&&Math.abs(i%8-sel%8)===1){b[i]=b[sel];b[sel]='';sel=-1;t=t==='🔴'?'⚫':'🔴';s.textContent='Turn: '+t}else sel=-1;paint()},box);q.style.background=((i/8|0)+i%8)%2?'#333':'#171717'})}paint()}
function chess(){add('p','Chessboard practice: select a piece to see its square. This mini version does not enforce full chess rules.');let p='♜♞♝♛♚♝♞♜♟♟♟♟♟♟♟♟'.split('').concat(Array(32).fill(''), '♙♙♙♙♙♙♙♙♖♘♗♕♔♗♘♖'.split('')),box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(8,1fr)';p.forEach((v,i)=>{let b=btn(v||'·',()=>status().textContent='Selected square '+(i+1),box);b.style.background=((i/8|0)+i%8)%2?'#555':'#ddd';b.style.color='black'})}
function dots(){add('p','Tap the dots to draw practice lines.');let box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(4,1fr)';for(let i=0;i<16;i++)btn('●',()=>{s.textContent='Line selected!'},box);let s=status()}
function mines(){let bombs=new Set();while(bombs.size<5)bombs.add(Math.random()*25|0);let box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(5,1fr)';let s=status(),opened=0;for(let i=0;i<25;i++)btn('?',e=>{let b=box.children[i];if(bombs.has(i)){b.textContent='💣';s.textContent='Mine! Game over.';[...box.children].forEach(x=>x.disabled=true)}else{b.textContent='✓';b.style.background='#246039';opened++;if(opened===20)s.textContent='You win!'}},box)}
function basketball(){let[c,x]=canvas(500,280),score=0,shots=0,s=add('p','Score 0 | Shots 0'),a=add('input'),p=add('input');a.type=p.type='range';a.min=20;a.max=75;a.value=45;p.min=20;p.max=90;p.value=50;add('p','Adjust angle and power, then shoot.');btn('🏀 SHOOT',()=>{shots++;let bx=75,by=235,vx=Number(p.value)*.12*Math.cos(Number(a.value)*Math.PI/180),vy=-Number(p.value)*.18*Math.sin(Number(a.value)*Math.PI/180);function tick(){x.clearRect(0,0,500,280);x.strokeStyle='white';x.lineWidth=5;x.strokeRect(405,70,70,70);x.strokeStyle='#f70';x.beginPath();x.arc(440,140,23,0,Math.PI);x.stroke();x.fillStyle='#f70';x.beginPath();x.arc(bx,by,11,0,7);x.fill();bx+=vx;by+=vy;vy+=.25;if(by>225||bx>500){if(bx>405&&bx<475&&by<165){score+=2;beep()}s.textContent=`Score ${score} | Shots ${shots}`;draw();return}requestAnimationFrame(tick)}tick()});function draw(){x.clearRect(0,0,500,280);x.strokeStyle='white';x.strokeRect(405,70,70,70);x.strokeStyle='#f70';x.beginPath();x.arc(440,140,23,0,Math.PI);x.stroke();x.fillStyle='#f70';x.beginPath();x.arc(75,235,11,0,7);x.fill()}draw()}
function bowling(){let r=add('input'),s=status();r.type='range';r.min=10;r.max=100;r.value=50;add('p','Set power and bowl.');btn('BOWL',()=>{let n=Math.min(10,Math.floor(+r.value/10)+(Math.random()*3|0));s.textContent='Pins knocked down: '+n+(n===10?' — STRIKE!':'')})}
function penalty(){let goals=0,shots=0,s=add('p','Goals 0 / Shots 0');['Left','Centre','Right'].forEach(d=>btn('Shoot '+d,()=>{shots++;let keeper=['Left','Centre','Right'][Math.random()*3|0];if(d!==keeper)goals++;s.textContent=(d!==keeper?'GOAL!':'SAVED!')+` Goals ${goals}/${shots}`}))}
function golf(){let[c,x]=canvas(500,180),pos=35,n=0,s=add('p','Choose power and hit toward the hole.'),r=add('input');r.type='range';r.min=10;r.max=100;r.value=50;function draw(){x.clearRect(0,0,500,180);x.fillStyle='#286b35';x.fillRect(0,130,500,50);x.fillStyle='white';x.beginPath();x.arc(465,145,11,0,7);x.fill();x.fillStyle='#f70';x.beginPath();x.arc(pos,145,8,0,7);x.fill()}btn('HIT',()=>{n++;pos=Math.min(465,pos+(+r.value)*.75);draw();s.textContent=pos>=455?'HOLE IN! Shots '+n:'Shots '+n});draw()}
function trivia(){let qs=[['What colour is a ripe banana?',['Blue','Yellow','Black'],1],['Days in a week?',['5','6','7'],2],['Which sport uses a hoop?',['Basketball','Swimming','Tennis'],0],['Our planet?',['Mars','Earth','Venus'],1]],n=0,score=0,s=add('p','Score 0');function ask(){if(n===qs.length){out.innerHTML=`<h3>Quiz complete: ${score}/4</h3>`;return}let q=qs[n];add('h3',q[0]);q[1].forEach((v,i)=>btn(v,()=>{if(i===q[2])score++;n++;s.textContent='Score '+score;ask()}))}ask()}
function wordsearch(){let words=['GAME','PLAY','BALL','CODE'],letters='GAMEPLAYBALLCODE'.padEnd(64,'X').split(''),box=add('div');box.className='board';box.style.gridTemplateColumns='repeat(8,1fr)';letters.forEach(ch=>btn(ch,()=>{},box));add('p','Words are across the top rows: GAME, PLAY, BALL, CODE.')}
</script></body></html>
